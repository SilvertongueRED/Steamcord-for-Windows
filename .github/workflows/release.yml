name: release
run-name: Build & publish plugin release
on:
  # A push to main publishes v<package.json version> when that release does not exist
  # yet, so bumping the version and pushing is the whole release procedure. Pushing a
  # v* tag by hand still works the same way.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap gate: do nothing unless this version has no release yet.
  check-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version and look for an existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION does not exist yet, building it."
          fi

  # Real Windows runner: the Win32 process table, known folders, registry and netstat
  # helpers behind the Windows port cannot be exercised on Linux.
  windows-tests:
    needs: check-release
    if: needs.check-release.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python (the version Decky Loader for Windows runs plugins on)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Windows platform tests
        run: python -m unittest discover -s tests -p test_windows_support.py -v

  release-plugin:
    needs: [check-release, windows-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup PNPM@9
        uses: pnpm/action-setup@v4
        with:
          version: "9.4.0"

      - name: Build frontend from source
        run: |
          pnpm i
          pnpm run build

      - name: Test menu and expanded view lifecycle
        run: |
          node tests/steam-menu-lifecycle.test.cjs

      - name: Test private conversation ordering and navigation regressions
        run: |
          python3 -m unittest discover -s tests -p test_dm_preferences.py -v
          python3 -m unittest discover -s tests -p test_controller_input.py -v
          node tests/test-dm-channels.cjs
          node tests/test-dm-pin-navigation.cjs
          node tests/test-notify-audioloader.cjs
          node tests/test-notify-isolation.cjs
          python3 -m unittest discover -s tests -p test_discord_runtime.py -v
          python3 -m unittest discover -s tests -p test_overlay_environment.py -v
          python3 -m unittest discover -s tests -p test_dbus_next_py315.py -v
          python3 -m unittest discover -s tests -p test_steam_display_env.py -v
          python3 -m unittest discover -s tests -p test_windows_support.py -v
          node --test tests/test-chat-panel-layout.cjs tests/test-runtime-control.cjs tests/test-runtime-state.cjs

      - name: Download Decky Plugin CLI
        run: |
          mkdir $(pwd)/cli
          curl -L -o $(pwd)/cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x $(pwd)/cli/decky

      - name: Build plugin ZIP
        run: |
          $(pwd)/cli/decky plugin build $(pwd)

      - name: Check the ZIP serves both the Steam Deck and Windows
        run: |
          python3 tests/check_release_zip.py out/${{ github.event.repository.name }}.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it does not exist yet.
          tag_name: v${{ needs.check-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Steamcord ${{ needs.check-release.outputs.version }}
          files: out/${{ github.event.repository.name }}.zip
          # Hand-written notes lead; GitHub's generated change list follows them.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
